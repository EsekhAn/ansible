- name: Build project on build node
  hosts: build
  become: yes
  vars:
    repo_url: "https://github.com/EsekhAn/ansible.git"
    repo_version: "master"
    repo_dir: "/opt/myapp/repo"                 
    build_artifacts_dir: "/opt/myapp/artifacts"

  tasks:
    - name: Ensure Docker, compose plugin and git are installed
      ansible.builtin.package:
        name:
          - docker.io
          #- docker-compose-plugin
          - git
        state: present
    - name: Ensure docker service is running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/myapp
        - "{{ repo_dir }}"
        - "{{ build_artifacts_dir }}"

    - name: Clone or update repo on build node
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        version: "{{ repo_version }}"
        dest: "{{ repo_dir }}"
        force: yes
        #accept_hostkey: yes

    - name: Copy build compose file
      ansible.builtin.copy:
        src: "{{ repo_dir }}/docker-compose.build.yaml"
        dest: /opt/myapp/docker-compose.yml
        mode: '0644'
        remote_src: yes

    - name: Run builder container
      ansible.builtin.command:
        cmd: docker compose up --abort-on-container-exit --exit-code-from builder
        chdir: /opt/myapp

    - name: Tear down build compose project
      ansible.builtin.command:
        cmd: docker compose down
        chdir: /opt/myapp